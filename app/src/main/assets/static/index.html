<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="icon" href="data:,">
    <link rel="manifest" href="/static/manifest.json">
    <title>JecWeb Go</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="tabs">
        <button class="active" data-tab="search">Главная</button>
        <button data-tab="bookmarks">Закладки</button>
        <button data-tab="history">История</button>
        <button data-tab="magnets">Магниты</button>
        <button data-tab="settings">Настройки</button>
    </div>
    <div class="status-bar" id="statusBar">
        <span><span class="status-dot" id="localDot" style="background:gray"></span> TorrServer</span>
        <span><span class="status-dot" id="tvDot" style="background:gray"></span> ТВ</span>
        <span><span class="status-dot" id="jacredDot" style="background:gray"></span> JacRed</span>
        <span><span class="status-dot" id="posterDot" style="background:gray"></span> Постеры</span>
    </div>
    <div id="tab-search" class="tab-content">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Поиск..." autofocus>
            <div class="custom-select" id="typeSelect">
                <div class="select-selected">Все</div>
                <ul class="select-items">
                    <li data-value="-1" class="selected">Все</li>
                    <li data-value="movie">Фильмы</li>
                    <li data-value="serial">Сериалы</li>
                    <li data-value="docuserial">Докум.</li>
                    <li data-value="anime">Аниме</li>
                </ul>
            </div>
            <button id="searchBtn" class="search-btn">🔍</button>
        </div>

        <div id="filtersContainer" class="filters" style="display:none;">
            <span class="filter-chip" data-filter="1080p">1080p</span>
            <span class="filter-chip" data-filter="seeds50">50+ сидов</span>
            <span class="filter-chip" data-filter="2025">2025+</span> 
            <span class="filter-chip" data-filter="small">до 5 ГБ</span>
        </div>
        <div class="history-row" id="historyRow" style="display:none;">
            <div class="history-scroll history-collapsed" id="historyCloud"></div>
            <button id="historyToggle" class="history-tag" style="flex-shrink:0; cursor:pointer;">📋</button>
        </div>

        <!-- Каталог постеров (главная) -->
        <div id="catalogGrid" class="posters-grid"></div>
        <div id="catalogSentinel"></div>

        <!-- Результаты поиска (скрыты по умолчанию) -->
        <div id="results" style="display:none;"></div>

        <button id="loadMoreBtn" style="display:none; width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; cursor:pointer; margin-bottom:12px; font-size:0.9rem;">Загрузить ещё</button>
        <div id="sentinel"></div>
        <div id="status"></div>
    </div>
    <div id="tab-bookmarks" class="tab-content" style="display:none;"><div id="bookmarksList"></div></div>
    <div id="tab-history" class="tab-content" style="display:none;"><div id="playHistoryList"></div></div>
    <div id="tab-magnets" class="tab-content" style="display:none;">
        <div class="magnets-dashboard">
            <div class="magnet-device-card active" id="cardLocal"><span class="device-icon">📱</span><span class="device-title">Телефон</span><span class="device-count" id="localCount">0 активных</span></div>
            <div class="magnet-device-card" id="cardTV"><span class="device-icon">📺</span><span class="device-title">ТВ</span><span class="device-count" id="tvCount">0 активных</span></div>
        </div>
        <div id="localMagnets" class="magnets-list"></div>
        <div id="tvMagnets" class="magnets-list" style="display:none;"></div>
    </div>
    <div id="tab-settings" class="tab-content" style="display:none;"></div>

    <!-- Модальное окно плеера -->
    <div class="modal" id="playerModal">
        <div class="modal-content" style="max-width:800px; padding:0; background:#000; display:flex; flex-direction:column;">
            <button class="modal-close" id="closePlayerBtn">&times;</button>
            <div id="playerStatusDot" class="player-status-dot"></div>
            <video id="player" controls preload="auto" playsinline crossorigin="anonymous" style="width:100%; display:block; max-height:70vh;"></video>
            <div id="playerTorrentStatus" class="player-status-bar"></div>
        </div>
    </div>

    <!-- Модальное окно AI-ассистента -->
    <div class="modal" id="aiModal">
        <div class="modal-content">
            <div id="aiPanel">
                <div id="aiTopPanel">
                    <div id="aiTopTitle">🤖 AI Помощник</div>
                    <div id="aiTopDesc" style="display:none;">
                        <div id="aiDescText"></div>
                        <div style="display: flex; justify-content: flex-end; gap: 8px;">
                            <button id="aiDescSearchBtn" class="ai-desc-btn" title="Найти этот фильм">🔍</button>
                            <button id="aiDescCloseBtn" class="ai-desc-btn" title="Скрыть описание">✕</button>
                        </div>
                    </div>
                </div>
                <div class="ai-messages"></div>
                <div class="ai-chips"></div>
                <div class="ai-input-row">
                    <input type="text" id="aiInput" placeholder="Введите ответ...">
                    <button id="aiMicBtn" title="Голосовой ввод">🎤</button>
                    <button id="aiSendBtn">▶</button>
                </div>
            </div>
            <div class="ai-header" style="padding: 4px 0; display: flex; justify-content: space-between; align-items: center;">
                <span></span>
                <div>
                    <button id="aiClearBtn" class="ai-close-btn" title="Очистить историю" style="color:var(--red);">🗑️</button>
                    <button id="aiCloseBtn" class="ai-close-btn">✕</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно выбора раздачи (с размытым постером) -->
    <div class="modal" id="releasesModal">
        <div class="modal-content">
            <div class="ai-header" style="padding: 4px 0; margin-bottom: 8px;">
                <span id="releasesModalTitle">Доступные раздачи</span>
                <button id="releasesModalClose" class="ai-close-btn">✕</button>
            </div>
            <div id="releasesList" style="max-height: 60vh; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Модальное окно деталей фильма (с размытым постером) -->
    <div class="modal" id="detailsModal">
        <div class="modal-content" style="max-width:500px; padding:0; text-align:left;">
            <button class="modal-close" id="detailsModalClose">&times;</button>
            <div id="detailsContent" style="padding:16px;"></div>
        </div>
    </div>

    <div id="torrentStatusPanel" style="display:none; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); padding:8px; z-index:2000;">
        <button id="panelClose" style="position:absolute; top:2px; right:8px; background:none; border:none; color:var(--muted); font-size:1.2rem;">&times;</button>
        <div id="panelTorrentList"></div>
    </div>

    <div id="mascot-container" style="position:fixed; bottom:20px; right:20px; z-index:5000; cursor:pointer;">
        <div id="mascot" style="width:80px; height:80px; background:radial-gradient(circle, #4a148c, #1a237e); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem;">
            🤖
        </div>
    </div>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(() => console.log("SW registered")).catch(err => console.log("SW failed", err));
        }
    </script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/ws.js"></script>
    <script src="/static/js/search.js"></script>
    <script src="/static/js/player.js"></script>
    <script src="/static/js/magnets.js"></script>
    <script src="/static/js/bookmarks.js"></script>
    <script src="/static/js/history.js"></script>
    <script src="/static/js/settings.js"></script>
    <script src="/static/js/status.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/catalog.js"></script>
<script>
if (!sessionStorage.getItem("cache_cleared")) {
    sessionStorage.setItem("cache_cleared", "1");
    if ("caches" in window) {
        caches.keys().then(function(names) {
            for (let name of names) caches.delete(name);
        });
    }
    location.reload(true);
}
</script>
</body>
</html>
